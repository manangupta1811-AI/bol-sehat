at se zyada sona headache badha sakta hai."], "review": "Headache baar-baar ho, badhe, ya self-care se na sudhre to doctor se milo.", "warning": "Achanak bahut tez dard, head injury, fit, kamzori/sunnpan, bolne ya chalne mein dikkat, confusion, nazar chali jaana, tez bukhar ke saath gardan akadna: turant medical help."}, {"id": "cold", "name": "Sardi-khansi / Cold", "url": "https://www.nhs.uk/conditions/common-cold/", "source": "NHS - Common cold", "care": ["Aaram karo aur paani jaise fluids piyo.", "Khansi/chheenk ke liye tissue use karo, phir haath sabun se dhoyo.", "Bachchon ko garam paani ke bowl se bhaap mat dilao: jalne ka risk hai."], "review": "Bukhar 3 din se zyada, symptoms badhna, 10 din tak sudhar na hona, ya khansi 3 hafte se zyada: doctor se review.", "warning": "Saans ki dikkat ya chest pain ho to turant medical help lo."}, {"id": "fever", "name": "Bukhar / Fever (adults)", "url": "https://www.nhs.uk/conditions/fever-in-adults/", "source": "NHS - Fever in adults", "care": ["Aaram karo aur paani piyo, taaki dehydration na ho.", "Bukhar rehne tak ghar par raho aur doosron se nazdeeki contact se bacho.", "Thermometer use karte waqt uski instructions follow karo."], "review": "Bukhar ghar par care ke bawajood theek na ho ya badhe: jaldi doctor se milo.", "warning": "Saans ki dikkat, confusion, fit, ya tez bukhar ke saath gardan akadna ho to turant medical help."}, {"id": "acid", "name": "Acidity / Indigestion", "url": "https://www.nhs.uk/conditions/indigestion/", "source": "NHS - Indigestion", "care": ["Chai, coffee aur cola kam karo.", "Sone se 3-4 ghante pehle khana mat khao.", "Rich, mirchi wale aur fatty foods se bacho; smoking mat karo."], "review": "Baar-baar indigestion, severe pain, bina wajah weight loss, nigalne ki dikkat, baar-baar ulti, ya khoon: doctor se review.", "warning": "Chest pressure, chest pain, paseena, saans ki dikkat, ya dard arm/jaw/back tak jaaye to acidity maan kar ignore mat karo: emergency medical help lo."}, {"id": "cut", "name": "Chhota cut / Graze", "url": "https://www.nhs.uk/conditions/cuts-and-grazes/", "source": "NHS - Cuts and grazes", "care": ["Sirf chhote wound ki general care: pehle haath dhoyein.", "Bleeding ruk chuki ho to ghaav ko saaf paani se dhoyein, saaf dressing lagayein.", "Dressing saaf/sukhi rakhein. Koi phansi cheez khud na nikalein.", "Dirty wound, infection, bite/scratch ya tetanus ka doubt ho to clinician se assessment."], "review": "Bite, mitti/pus, redness, sujan, badhta dard, bukhar ya bada cut ho to jaldi medical help.", "warning": "Bleeding na ruke, gehra/bahut bada cut ho, sunnpan ho, ya kuch andar phansa ho: turant medical help. Phansi hui cheez khud mat nikalo."}, {"id": "const", "name": "Kabz / Constipation", "url": "https://www.nhs.uk/conditions/constipation/", "source": "NHS - Constipation", "care": ["Paani aur fluids zyada piyo; alcohol kam karo.", "Fibre dheere-dheere badhao: fruits, oats, wheat bran.", "Toilet ka time fix rakho; jhapat aaye to delay mat karo; pairon ke neeche chhota stool rakh kar ghutne upar karo.", "Roz walk ya halki exercise karo.", "Na sudhre to pharmacist se salah lo; laxative sirf unki salah par, thode din ke liye."], "review": "Kabz na sudhre, baar-baar ho, naya bowel-habit badlav, khoon, wazan ghatna ya pet dard ho to doctor se review. Severe pain ya pet dard ke saath potty/gas bilkul band ho to emergency help.", "warning": "Potty mein khoon, tez pet dard, baar-baar ulti, ya pet phoolna ho: jaldi medical help lo."}, {"id": "loose", "name": "Loose motions / Diarrhoea", "url": "https://www.nhs.uk/conditions/diarrhoea-and-vomiting/", "source": "NHS - Diarrhoea and vomiting", "care": ["Ghar par rest karo; paani chhote-chhote ghunt piyo. Fruit juice aur cold drink mat piyo.", "Bhukh lage tab khao; fatty aur teekha khana avoid karo.", "Pharmacist se ORS (oral rehydration powder) ke baare mein poochho.", "Haath sabun se baar-baar dhoyo; towels share mat karo; symptoms rukne ke 2 din tak bahar/kaam kam jao."], "review": "Diarrhoea 7 din se zyada, ulti 2 din se zyada, potty mein khoon, ya dehydration ke signs (susoo kam ya dark): doctor se milo.", "warning": "Ulti mein khoon ya coffee jaisa, achanak tez pet dard, gardan akadna ke saath tez sar dard, confusion, ya saans tez/mushkil: turant emergency help."}, {"id": "throat", "name": "Gala kharab / Sore throat", "url": "https://www.nhs.uk/conditions/sore-throat/", "source": "NHS - Sore throat", "care": ["Garam namak-paani se gargle karo (aadha chammach namak, garam paani) - thook do, peena nahi.", "Paani piyo; thanda ya naram khana khao; dhuan se door raho; aaram karo.", "Pharmacist se dard ke liye options poochh sakte ho. Antibiotics sirf doctor/pharmacist de."], "review": "1 hafte mein na sudhre, baar-baar ho, ya muh/gardan mein ganth ya 3 hafte purana ulcer ho: doctor se milo.", "warning": "Saans mushkil, nigalna mushkil ya lar tapakna, saans mein seeti-awaz, ya bahut tez bigadna: turant emergency help."}];

function webSpeak(text){if(!soundOn||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(text);u.lang='hi-IN';u.rate=1;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('hi'));if(v)u.voice=v;speechSynthesis.speak(u)}

function goHome(){stopSpeaking();state={};main.innerHTML=`<div class="micwrap"><button id="mic" aria-label="Takleef boliye" onclick="micTap()">🎙</button></div><div class="prompt">Apni takleef se shuru karein</div><div class="sub">Complaint ke hisaab se alag sawal.<br>Student prototype, doctor nahi.</div><div class="heard" id="heard"></div><div id="textin"><input id="tin" maxlength="1200" aria-label="Takleef likhein" placeholder="Jaise: mujhe sar dard hai" onkeydown="if(event.key==='Enter')startInput(this.value)"><button onclick="startInput(document.getElementById('tin').value)">Aage</button></div><div class="chips">${topics.map(t=>`<button class="chip" onclick="startInput('${t.name}','${t.id}')">${t.name}</button>`).join('')}</div>${safety()}<p class="mini">v1.3.4 • Build 10014 • 14 NOV 2026<br>Offline care/audio. Phone speech provider internet use kar sakta hai. Symptom record app save/upload nahi karta.</p>${emergency()}`;window.scrollTo(0,0);speak(WELCOME)}
function micTap(){stopSpeaking();const h=document.getElementById('heard');h.style.display='block';h.textContent='Sun raha hoon...';listen(t=>{if(!document.getElementById('tin'))return;document.getElementById('tin').value=t||'';h.textContent=t?'Yeh suna: '+t+'. Check karke Aage dabao.':'Aawaz nahi mili. Text/chip use karo.'})}
const matches=[['head',/sar\s*dard|sir\s*dard|headache|सिर.{0,3}दर्द|सर.{0,3}दर्द/i],['cold',/sardi|khansi|cough|cold|सर्दी|खांसी|खाँसी/i],['fever',/bukhar|fever|बुखार/i],['acid',/acidity|indigestion|heartburn|badhazmi|बदहजमी|बदहज़मी|एसिडिटी/i],['cut',/cut|graze|kharonch|ghaav|घाव|कट|खरोंच/i],['const',/kabz|constipation|कब्ज/i],['loose',/loose\s*motion|diarrh|dast|दस्त|लूज़|लूज/i],['throat',/gala\s*(kharab|dard)|sore\s*throat|गला.{0,3}(खराब|दर्द)|गले.{0,3}दर्द/i]];
function detectTopics(raw){if(/\b(nahi|nahin|no|not)\b|नहीं|नही/i.test(raw))return [];return matches.filter(([,re])=>re.test(raw)).map(([id])=>id)}
function explicitDanger(raw){return raw.split(/[.!?।,;\n]/).some(c=>{if(/\b(nahi|nahin|no|not)\b|नहीं|नही/i.test(c))return /(?:khoon|bleeding|खून|ख़ून).{0,18}(?:nahi\s*ruk|नहीं\s*रुक)/i.test(c)||/(?:saans|साँस|सांस).{0,15}(?:nahi\s*(?:aa|le)|नहीं.{0,4}(?:आ|ले))/i.test(c);return /(?:achanak|sudden|अचानक).{0,20}(?:bahut\s*tez|worst|बहुत\s*तेज|बहुत\s*तेज़).{0,12}(?:sar|sir|head|सिर|सर)|(?:sar|sir|head|सिर|सर).{0,15}(?:achanak|sudden|अचानक).{0,15}(?:bahut|worst|बहुत)|(?:chest|seene|सीने).{0,12}(?:pressure|dabaav|दबाव)|(?:behosh|unconscious|बेहोश)/i.test(c)})}
function startInput(raw,id){raw=String(raw||'').trim();if(!raw)return;stopSpeaking();state={raw:raw.slice(0,1200),topic:null,answers:{},history:[],review:null};if(explicitDanger(raw))return finish('emergency','Aapke likhe shabdon mein sambhavit khatre ka sanket hai. Yeh automated keyword check hai, diagnosis nahi.');state.pendingId=id||null;state.candidates=detectTopics(raw);if(!adultConfirmed)return showQuestion(SCOPE,handleScope);chooseTopic()}
const SCOPE={id:'scope',q:['Yeh jaankari 18+ adult ke liye hai?','यह जानकारी अठारह साल या उससे बड़े व्यक्ति के लिए है?'],opts:[['Haan, 18+','हाँ, अठारह या उससे ज़्यादा'],['18 se kam','अठारह से कम'],['Pata nahi','पता नहीं']]};
function handleScope(i){if(i!==0)return finish('review','Yeh prototype 18 se kam ya unsure age ke liye nahi hai. Doctor ki salah lein.');adultConfirmed=true;chooseTopic()}
function chooseTopic(){if(state.pendingId){state.topic=topics.find(t=>t.id===state.pendingId);state.pendingId=null;return nextNode()}const cs=state.candidates;if(cs.length===1){const t=topics.find(t=>t.id===cs[0]);return showQuestion({id:'confirm',q:['Aapne '+t.name+' bataya. Isi par sawal poochhun?','आपने '+TOPIC_HI[t.id]+' बताया। इसी पर सवाल पूछूँ?'],opts:[['Haan','हाँ'],['Topic badlein','विषय बदलें']]},i=>{if(i===0){state.topic=t;nextNode()}else topicPicker()})}topicPicker()}
function topicPicker(){showQuestion({id:'topic',q:[state.candidates?.length>1?'Kai topics mile. Pehle kis par baat karein?':'Kaunsi takleef par jaankari chahiye?',state.candidates?.length>1?'कई तकलीफ़ मिलीं। पहले किस पर बात करें?':'किस तकलीफ़ पर जानकारी चाहिए?'],hint:['Topic chunna diagnosis nahi. Pet dard ko apne-aap acidity nahi maante. Dusri complaints doctor ko bhi batayein.','विषय चुनना निदान नहीं। पेट दर्द को अपने आप एसिडिटी नहीं मानते। दूसरी तकलीफ़ भी डॉक्टर को बताइए।'],opts:[...topics.map(t=>[t.name,TOPIC_HI[t.id]]),['Kuch aur / sure nahi','कुछ और या पक्का नहीं']]},i=>{if(i>=topics.length)return finish('review','Yeh complaint limited library mein nahi hai. Doctor se check karayein.');state.topic=topics[i];state.answers={};state.history=[];state.review=null;nextNode()})}
function visible(n){return !n.when||Object.entries(n.when).every(([id,vals])=>vals.includes(state.answers[id]?.index))}
function nextNode(){delete state.outcome;const n=FLOWS[state.topic.id].find(n=>visible(n)&&!state.answers[n.id]);if(!n)return showSummary();showQuestion(n,(i,v)=>acceptNode(n,i,v))}
function remember(n,i,v){state.answers[n.id]={id:n.id,q:n.q[0],value:v,index:i,route:(n.routes&&n.routes[i])||null,sources:n.sources||[]};state.history.push(n.id)}
const RANK={info:0,routine:1,review:2,uncertain:3,urgent:4,bite:5,emergency:6};
function worstOutcome(){let w=null;for(const a of Object.values(state.answers)){if(a.route&&(!w||RANK[a.route]>RANK[w]))w=a.route}return w}
function dangerStrip(){const w=worstOutcome();if(!w||RANK[w]<RANK.urgent)return '';if(w==='emergency')return `<div class="alertbar">Aapke jawab mein khatre ka sanket mila hai. Abhi takleef ho to <a href="tel:112">112 par call karein</a>. Baaki sawal Doctor Card ke liye jaari rahenge.</div>`;return `<div class="alertbar amber">Aapka ek jawab serious hai, doctor review chahiye. Takleef badhe to 112 par call karein. Baaki sawal jaari rahenge.</div>`}
function acceptNode(n,i,v){remember(n,i,v);nextNode()}
function showQuestion(n,cb){stopSpeaking();state.current={...n,cb};window.scrollTo(0,0);const h=n.hint||['Jawab doctor ko dikhane ke liye hai, diagnosis nahi.','जवाब डॉक्टर को दिखाने के लिए है, निदान नहीं।'];main.innerHTML=`${dangerStrip()}<div class="qcard"><div class="qnum">${state.topic?esc(state.topic.name):'BOL SEHAT'} • DOCTOR CARD</div><div class="qtext">${esc(n.q[0])}</div><div class="qsub">${esc(h[0])}</div>${n.kind==='text'?`<textarea id="answerText" maxlength="300" aria-label="Jawab likhein" placeholder="Likhein, ya pata nahi"></textarea><button class="opt" onclick="submitText(event)">Jawab rakhein / Aage</button><button class="opt" onclick="chooseUnknown(event)">Pata nahi / chhodein</button>`:n.kind==='multi'?`<div class="opts">${n.opts.map((o,i)=>`<label class="opt check"><input type="checkbox" value="${i}" onchange="multiChanged(this)"> ${esc(o[0])}</label>`).join('')}</div><button class="opt" onclick="submitMulti(event)">Chune hue jawab rakhein</button>`:`<div class="opts">${n.opts.map((o,i)=>`<button class="opt" onclick="choose(${i},event)">${esc(o[0])}</button>`).join('')}</div>`}<div class="tools"><button class="opt listen" onclick="speakQuestion()">Sawaal + options suno</button><button class="opt listen" onclick="voiceAnswer()">🎙 Jawab bolo</button>${state.history.length?'<button class="opt listen" onclick="back()">← Pichhla jawab badlein</button>':''}<button class="opt listen" onclick="changeTopic()">Topic badlein</button></div><div class="mini" id="vstatus"></div></div>${safety()}${emergency()}`;speakQuestion()}
function rapidClick(ev){if(!ev)return false;const now=performance.now();if(now-lastUserChoice<350)return true;lastUserChoice=now;return false}
function choose(i,ev){if(rapidClick(ev))return;const n=state.current;if(!n||!n.opts[i])return;state.current=null;n.cb(i,n.opts[i][0])}
function chooseUnknown(ev){if(rapidClick(ev))return;const n=state.current;if(!n)return;state.current=null;n.cb(-1,'Pata nahi / jawab nahi diya')}
function submitText(ev){if(rapidClick(ev))return;const n=state.current;if(!n)return;const v=document.getElementById('answerText').value.trim();if(!v){document.getElementById('vstatus').textContent='Jawab likhein ya Pata nahi chunein.';return}state.current=null;n.cb(-1,v.slice(0,300))}
function multiChanged(el){const inputs=[...document.querySelectorAll('.check input')];const opts=state.current.opts;const isNone=i=>/Inmein se|Pata nahi/.test(opts[i][0]);if(el.checked){if(isNone(+el.value))inputs.forEach(x=>{if(x!==el)x.checked=false});else inputs.forEach(x=>{if(isNone(+x.value))x.checked=false})}}
function submitMulti(ev){if(rapidClick(ev))return;const n=state.current,idx=[...document.querySelectorAll('.check input:checked')].map(x=>+x.value);if(!n||!idx.length){document.getElementById('vstatus').textContent='Kam se kam ek jawab chunein.';return}state.current=null;n.cb(idx,idx.map(i=>n.opts[i][0]).join('; '))}
function questionSpeech(n){return n.q[1]+'। '+(n.hint?n.hint[1]+'। ':'')+(n.kind==='text'?'जवाब लिखिए या पता नहीं चुनिए।':n.opts.map((o,i)=>(i+1)+'. '+o[1]).join('। ')+(n.kind==='multi'?'। कई जवाब चुन सकते हैं।':''))+'। बटन से जवाब पक्का कीजिए।'}
function speakQuestion(){if(state.current)speak(questionSpeech(state.current))}
function voiceAnswer(){stopSpeaking();const n=state.current;if(!n)return;document.getElementById('vstatus').textContent='Sun raha hoon...';listen(t=>{if(state.current!==n)return;const v=document.getElementById('vstatus');if(v)v.textContent=t?'Yeh suna: '+t+'. Neeche jawab check/confirm karein.':'Aawaz nahi mili. Button/text use karein.';if(t&&n.kind==='text')document.getElementById('answerText').value=t.slice(0,300);else if(t){const norm=s=>s.trim().replace(/[।.]/g,'').toLowerCase();const idx=n.opts.findIndex(o=>norm(o[0])===norm(t)||norm(o[1])===norm(t));if(idx>=0){const bs=document.querySelectorAll('.opts .opt');bs[idx]?.focus();if(bs[idx])bs[idx].style.borderColor='#0d9488'}}})}
function back(){stopSpeaking();const id=state.history.pop();if(!id)return;delete state.answers[id];delete state.outcome;nextNode()}
function editAnswer(id){const k=state.history.indexOf(id);if(k<0)return;state.history.slice(k).forEach(x=>delete state.answers[x]);state.history=state.history.slice(0,k);delete state.outcome;nextNode()}
function changeTopic(){stopSpeaking();state.answers={};state.history=[];state.review=null;state.topic=null;delete state.outcome;state.candidates=[];topicPicker()}
function cardText(){return 'BOL SEHAT - DOCTOR CARD\nSelf-reported, not a diagnosis or medical document.\nOriginal complaint: '+state.raw+'\nSelected topic (not diagnosis): '+(state.topic?.name||'Unconfirmed')+'\n'+state.history.map(id=>state.answers[id].q+': '+state.answers[id].value).join('\n')+'\nUnasked/unconfirmed items are not negative answers.\nAction shown: '+(state.outcome||'Review answers')+'\nTime: '+new Date().toLocaleString('en-IN')+'\nNo doctor verification. Please review with a clinician.'}
function card(edit=false){return `<div class="dcard"><h3>DOCTOR CARD • SELF-REPORTED</h3><div class="row"><b>Aapke apne shabd</b>${esc(state.raw)}</div><div class="row"><b>Chuna hua topic, diagnosis nahi</b>${esc(state.topic?.name||'Unconfirmed')}</div>${state.history.map(id=>{const a=state.answers[id];return `<div class="row"><b>${esc(a.q)}</b>${esc(a.value)} ${edit?`<button class="edit" onclick="editAnswer('${id}')">Badlein</button>`:''}</div>`}).join('')}<p class="disc">Jo poochha nahi ya confirm nahi hua, use "Nahi" nahi maana gaya. Symptom record app save/upload nahi karta. Phone speech provider audio process kar sakta hai.</p><div class="bigbtns"><button class="bigbtn card" onclick="copyCard()">Copy Card</button><button class="bigbtn call" onclick="callFam()">Family Call</button></div></div>`}
function showSummary(){stopSpeaking();state.current=null;main.innerHTML=`<div class="qcard"><h2>Jawab check karein</h2><p class="fine">Galat jawab badlein. Badalne par uske baad ke dependent jawab dobara poochhe jayenge.</p></div>${card(true)}<button class="opt" onclick="finish(worstOutcome()||'info')">Check kiya • Jaankari dekhein</button>${safety()}${emergency()}`;window.scrollTo(0,0)}
const ACTIONS={emergency:['Abhi emergency medical help lein','अभी इमरजेंसी मेडिकल मदद लें। इमरजेंसी में एक एक दो पर कॉल करें।'],urgent:['Jaldi / abhi doctor se urgent review lein','जल्दी, अभी डॉक्टर से अर्जेंट समीक्षा लें। हालत गंभीर हो तो इमरजेंसी में एक एक दो पर कॉल करें।'],routine:['Doctor se appointment / review karayein','डॉक्टर से अपॉइंटमेंट या समीक्षा कराएँ। बिगड़ने पर जल्दी मदद लें।'],review:['Doctor se check karayein','डॉक्टर से जाँच कराएँ। यह स्थिति इस सीमित प्रोटोटाइप की सामान्य जानकारी से बाहर है।'],uncertain:['Pakka nahi: medical advice lein','पक्का नहीं है, मेडिकल सलाह लें। इस जवाब से सुरक्षित होने का दावा नहीं किया जा सकता।'],bite:['Jaanwar ka exposure: jaldi health facility jayein','जानवर के काटने या खरोंच पर जल्दी स्वास्थ्य केंद्र जाएँ। घाव साबुन और बहते पानी से पंद्रह मिनट धोएँ। मदद में देर न करें।'],info:['Is topic par aam jaankari','इस विषय पर सामान्य जानकारी। यह निदान या घर पर रहने की इजाज़त नहीं है।']};
function outcomeSpeech(type,topic){return ACTIONS[type][1]+' '+(type==='info'?CARE_HI[topic]+' ': 'कृपया इस समस्या के लिए डॉक्टर से मिलें। बिना डॉक्टर की जाँच के मैं पक्का जवाब नहीं दे सकता। मैनुअल जाँच इस ऐप में नहीं होती। ')+'यह डॉक्टर की सलाह नहीं है। डॉक्टरों ने इस प्रोटोटाइप को अभी जाँचा नहीं है।'}
function finish(type,reason=''){stopSpeaking();state.current=null;state.outcome=type;const trig=Object.values(state.answers||{}).filter(a=>a.route);if(!reason&&trig.length)reason='Is natije ke peechhe yeh jawab: '+trig.map(a=>a.q+' - '+a.value).join(' | ');state.reason=reason;const t=state.topic;const explanation=type==='info'?'Yeh diagnosis, ghar par rehne ki permission ya danger na hone ka proof nahi. Doubt ya bigadti takleef mein doctor se madad lein.':sorryLine+' Doctor se milkar check karayein. Bina manual check ke main verified jawab nahi de sakta. Manual review app mein nahi hota; doctor ko dikhana hoga.';main.innerHTML=`<div class="anscard ${type==='emergency'?'warn':'plain'}"><div class="anslvl">${ACTIONS[type][0]}</div><div class="anstxt">${esc(explanation)}</div>${reason?`<p class="fine">${esc(reason)}</p>`:''}</div>${type==='emergency'?'<a class="opt urgentLink" href="tel:112">112 Emergency call</a>':''}${type==='bite'?'<div class="tips">Ghaav/kharonch ko abhi sabun aur bahte paani se 15 minute dhoyein. Jaldi health facility jayein. Pet/vaccinated jaanwar maan kar ignore na karein. Vaccine ka faisla clinician karega.</div>':''}${type==='info'&&t?`<div class="tips"><h3>GENERAL CARE • TREATMENT PLAN NAHI</h3><ul>${t.care.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><p class="fine">Dawa/dose khud mat chunein. Doctor/pharmacist se poochhein.</p></div><div class="tips"><h3>DOCTOR SE KAB MILNA HAI</h3><p>${esc(t.review)}</p><p>${esc(t.warning)}</p><p class="fine">Yeh poori checklist nahi hai.</p></div>`:''}<button class="opt listen" onclick="speakOutcome()">Jawab suno</button>${sourcePanel()}${card(true)}${safety()}${emergency()}<button class="opt" onclick="goHome()">Nayi baat shuru karein</button>`;window.scrollTo(0,0);speakOutcome()}
function sourcePanel(){const ids=new Set([17]);if(state.topic)FLOWS[state.topic.id].forEach(n=>(n.sources||[]).forEach(id=>ids.add(id)));return `<details class="tips"><summary>Sources • 11 NOV 2026 ko padhe</summary><p class="fine">NHS/NICE/India government. Hindi/Hinglish app ki translation hai, sources ne endorse/verify nahi kiya. UK service numbers India mein use nahi hote.</p>${[...ids].sort((a,b)=>a-b).map(i=>`<a class="source" target="_blank" rel="noopener" href="${SOURCES[i-1]}">[${i}] ${esc(SOURCES[i-1])} ↗</a>`).join('')}</details>`}
function speakOutcome(){speak(outcomeSpeech(state.outcome,state.topic?.id))}
function copyCard(){const txt=cardText();if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>alert('Card copy ho gaya'),()=>fallback(txt));else fallback(txt)}
function fallback(txt){const a=document.createElement('textarea');a.value=txt;main.appendChild(a);a.select();try{if(!document.execCommand('copy'))throw 0;alert('Card copy ho gaya')}catch{alert('Copy nahi hua. Card ka screenshot lein.')}a.remove()}
function callFam(){const v=prompt('Family number check/likhein:',localStorage.getItem('bs_fam')||'');if(v===null)return;const n=v.replace(/[^\d+]/g,'');if(!/^\+?\d{10,15}$/.test(n))return alert('Sahi number likhein.');if(confirm('Is number par call karein? '+n)){localStorage.setItem('bs_fam',n);location.href='tel:'+n}}
goHome();
</script></body></html>
